<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo desktop-logo">nineteetwo</a>

    <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle Menu">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </button>

    <nav class="menu_box" id="menuBox">
      <div class="mobile-header">
        <a href="index.html" class="logo">nineteetwo</a>
      </div>

      <a href="projects.html" data-i18n="projects">projects</a>
      <a href="cv.html" data-i18n="resume">resume</a>
      <a href="contact.html" data-i18n="contact">contact</a>

      <div class="dropdown">
        <a class="dropbtn" onclick="toggleLang(event)" data-i18n="language">language &#9662;</a>
        <div class="dropdown-content" id="langDropdown">
          <a onclick="changeLanguage(event, 'en')" data-i18n="english">english</a>
          <a onclick="changeLanguage(event, 'tr')" data-i18n="turkish">turkish</a>
          <a onclick="changeLanguage(event, 'de')" data-i18n="german">german</a>
          <a onclick="changeLanguage(event, 'jp')" data-i18n="japanese">japanese</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="page-content">
    <div class="contact-container">
      <p class="contact-header" data-i18n="contactDesc">// You can reach out to me via the following platforms:</p>

      <div class="contact-line">
        <span class="contact-prompt">&gt;</span>
        <span class="contact-label" data-i18n="contactLinkedIn">LinkedIn</span>
        <span class="contact-sep">—</span>
        <a href="https://www.linkedin.com/in/nineteetwo/" target="_blank" class="contact-link">linkedin.com/in/nineteetwo</a>
      </div>

      <div class="contact-line">
        <span class="contact-prompt">&gt;</span>
        <span class="contact-label" data-i18n="contactGitHub">GitHub</span>
        <span class="contact-sep">—</span>
        <a href="https://github.com/nineteetwo" target="_blank" class="contact-link">github.com/nineteetwo</a>
      </div>

      <div class="contact-line">
        <span class="contact-prompt">&gt;</span>
        <span class="contact-label" data-i18n="contactEmail">mail</span>
        <span class="contact-sep">—</span>
        <a href="mailto:rickdotfri@protonmail.com" class="contact-link">rickdotfri@protonmail.com</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 nineteetwo
  </footer>

  <script src="i18n.js" defer></script>
