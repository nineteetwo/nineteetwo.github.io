<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nineteetwo | projects</title>
  <meta name="description" content="Projects built by nineteetwo — a curated collection of work pulled directly from GitHub.">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo desktop-logo">nineteetwo</a>

    <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle Menu">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </button>

    <nav class="menu_box" id="menuBox">
      <div class="mobile-header">
        <a href="index.html" class="logo">nineteetwo</a>
      </div>

      <a href="projects.html" data-i18n="projects">projects</a>
      <a href="cv.html" data-i18n="resume">resume</a>
      <a href="contact.html" data-i18n="contact">contact</a>

      <div class="dropdown">
        <a class="dropbtn" onclick="toggleLang(event)" data-i18n="language">language &#9662;</a>
        <div class="dropdown-content" id="langDropdown">
          <a onclick="changeLanguage(event, 'en')" data-i18n="english">english</a>
          <a onclick="changeLanguage(event, 'tr')" data-i18n="turkish">turkish</a>
          <a onclick="changeLanguage(event, 'de')" data-i18n="german">german</a>
          <a onclick="changeLanguage(event, 'jp')" data-i18n="japanese">japanese</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="projects-hero">
    <p data-i18n="pinnedRepos">// pinned repositories — pulled directly from github</p>
  </div>

  <div class="projects-grid" id="projectsGrid">
    <div class="projects-status">
      <span data-i18n="fetchingRepos">&gt; fetching repositories</span><span class="blink">_</span>
    </div>
  </div>

  <footer class="site-footer">
    &copy; 2026 nineteetwo
  </footer>

  <script src="i18n.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="bg.js" defer></script>
  <script src="projects.js" defer></script>
</body>
</html>
